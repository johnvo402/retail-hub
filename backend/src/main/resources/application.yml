spring:
  application:
    name: retailhub
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/retailhub}
    username: ${DB_USERNAME:retailhub}
    password: ${DB_PASSWORD:retailhub_dev}
    hikari:
      maximum-pool-size: 12
      minimum-idle: 2
      connection-timeout: 30000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        order_inserts: true
        order_updates: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s
      repositories:
        enabled: false
  elasticsearch:
    uris: ${ELASTICSEARCH_URL:http://localhost:9200}

server:
  port: 8080
  shutdown: graceful
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

springdoc:
  api-docs:
    enabled: ${OPENAPI_ENABLED:true}
  swagger-ui:
    enabled: ${OPENAPI_ENABLED:true}
    path: /swagger-ui.html

retailhub:
  security:
    jwt-secret: ${JWT_ACCESS_SECRET:change-me-local-development-secret-key-32-bytes}
    access-expiration-seconds: ${JWT_ACCESS_EXPIRATION:900}
    refresh-expiration-seconds: ${REFRESH_TOKEN_EXPIRATION:1209600}
    cookie-secure: ${COOKIE_SECURE:false}
    cookie-same-site: ${COOKIE_SAME_SITE:Strict}
    cookie-domain: ${COOKIE_DOMAIN:}
    cors-allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:5173}
  cache:
    product-ttl: ${PRODUCT_CACHE_TTL:10m}
  bootstrap:
    admin-email: ${ADMIN_EMAIL:}
    admin-password: ${ADMIN_PASSWORD:}

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%X{traceId:-}] %logger{36} - %msg%n"
