name: Build and deploy production

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

env:
  BACKEND_IMAGE: ghcr.io/johnvo402/retail-hub-backend
  FRONTEND_IMAGE: ghcr.io/johnvo402/retail-hub-frontend

jobs:
  build-backend:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out the verified commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ env.BACKEND_IMAGE }}:${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  build-frontend:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out the verified commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          build-args: VITE_API_URL=/api
          tags: ${{ env.FRONTEND_IMAGE }}:${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy:
    needs: [build-backend, build-frontend]
    runs-on: [self-hosted, Windows, X64, production]
    permissions:
      contents: read
      packages: read
    environment:
      name: production
    concurrency:
      group: retailhub-production
      cancel-in-progress: false
    steps:
      - name: Check out the image source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Ignore a stale deployment
        id: freshness
        shell: powershell
        run: |
          git fetch origin main --quiet
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to read the current main commit."
          }

          $currentMain = (git rev-parse origin/main).Trim()
          $target = "${{ github.event.workflow_run.head_sha }}"
          if ($currentMain -eq $target) {
            "deploy=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          } else {
            "deploy=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            Write-Host "Skipping stale commit $target because main is now $currentMain."
          }

      - name: Log in to GHCR
        if: steps.freshness.outputs.deploy == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy the exact commit SHA
        if: steps.freshness.outputs.deploy == 'true'
        shell: powershell
        env:
          PRODUCTION_ENV_FILE: ${{ vars.PRODUCTION_ENV_FILE }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:PRODUCTION_ENV_FILE)) {
            throw "Set the production environment variable PRODUCTION_ENV_FILE to the server-side .env.production path."
          }

          & .\scripts\deploy.ps1 `
            -Sha "${{ github.event.workflow_run.head_sha }}" `
            -EnvFile $env:PRODUCTION_ENV_FILE `
            -BackendRepository "${{ env.BACKEND_IMAGE }}" `
            -FrontendRepository "${{ env.FRONTEND_IMAGE }}"

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
